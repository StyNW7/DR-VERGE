# DR-VERGE full method
run_name: dual_csd
seed: 42
train_csv: data/splits/drtid_train.csv
val_csv: data/splits/drtid_val.csv
batch_size: 16
lr: 0.001
epochs: 30
patience: 5
teacher_ckpt: checkpoints/teacher/teacher_final.pt
student_backbone_ckpt: checkpoints/pretrained_backbones/aptos_lightweight_backbone.pt
output_ckpt: checkpoints/student/dual_csd/best.pt
view_mode: dual
alpha: 0.5
beta: 0.5
lambda_aux: 0.5
csd_variant: smoothl1   # smoothl1 (default) | direction_magnitude | kl_softmax (ablation)
use_counterfactual_csd: false   # set true for the same-head counterfactual ablation (judge.md Flag 1/3)
tau_kd: 2.0
tau_csd: 0.5
