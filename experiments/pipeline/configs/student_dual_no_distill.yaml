# No-distillation baseline -- dual-view trained purely on task loss + aux supervision
run_name: dual_no_distill
seed: 42
train_csv: data/splits/drtid_train.csv
val_csv: data/splits/drtid_val.csv
batch_size: 16
lr: 0.001
epochs: 30
patience: 5
teacher_ckpt: checkpoints/teacher/teacher_final.pt
student_backbone_ckpt: checkpoints/pretrained_backbones/aptos_lightweight_backbone.pt
output_ckpt: checkpoints/student/dual_no_distill/best.pt
view_mode: dual
alpha: 0.0
beta: 0.0
lambda_aux: 0.5   # aux loss still applies here -- see technical doc Section 5.2
